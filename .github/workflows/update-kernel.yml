name: Update Kernel

on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）检查上游是否有新的稳定版 Release
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kernel
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 查询上游最新 Release
        id: up
        run: |
          set -euo pipefail
          repo_api=https://api.github.com/repos/pymumu/smartdns
          json=$(curl -fsSL "$repo_api/releases?per_page=30")

          # 只跟稳定版：prerelease/draft 一律跳过；tag 名里带 rc/beta/alpha/preview
          # 的也跳过——上游的 RC 有时不标 prerelease（Release48.5-RC1 就是 false），
          # 光看 prerelease 字段会把 RC 当成正式版更新进来。
          tag=''
          while IFS="$(printf '\t')" read -r pre draft name; do
            [ -n "$name" ] || continue
            [ "$pre" = 'false' ] || continue
            [ "$draft" = 'false' ] || continue
            case "$(printf '%s' "$name" | tr 'A-Z' 'a-z')" in
              *rc*|*beta*|*alpha*|*preview*) continue ;;
            esac
            tag="$name"
            break
          done <<EOF
          $(printf '%s' "$json" | jq -r '.[] | "\(.prerelease)\t\(.draft)\t\(.tag_name)"')
          EOF

          if [ -z "$tag" ]; then
            echo '上游暂无稳定版 Release（最新均为 RC/预发布），本次跳过'
            echo 'tag=' >> "$GITHUB_OUTPUT"
            echo 'ver=' >> "$GITHUB_OUTPUT"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ver=$(curl -fsSL "$repo_api/releases/tags/$tag" | jq -r '.assets[].name' \
                | sed -n 's/^smartdns\.\(.*\)\.aarch64-linux-all\.tar\.gz$/\1/p' | head -n 1)
          current=$(tr -d '\r\n' < kernel.tag 2>/dev/null || true)

          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "ver=$ver"     >> "$GITHUB_OUTPUT"
          echo "上游最新稳定版: ${tag} (内核 ${ver}); 当前: ${current}"

          if [ "$tag" != "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载并校验内核二进制
        if: steps.up.outputs.changed == 'true'
        run: |
          set -euo pipefail
          base="https://github.com/pymumu/smartdns/releases/download/${{ steps.up.outputs.tag }}"
          curl -fL --retry 3 --retry-delay 5 -o binary/arm   "$base/smartdns-arm"
          curl -fL --retry 3 --retry-delay 5 -o binary/arm64 "$base/smartdns-aarch64"
          chmod +x binary/arm binary/arm64

          # e_machine: arm=0x28 (2800), aarch64=0xb7 (b700)
          arm_m=$(od -An -tx1 -j18 -N2 binary/arm | tr -d ' \n')
          arm64_m=$(od -An -tx1 -j18 -N2 binary/arm64 | tr -d ' \n')
          echo "arm e_machine=$arm_m, arm64 e_machine=$arm64_m"
          [ "$arm_m" = "2800" ]   || { echo '::error::binary/arm 架构校验失败'; exit 1; }
          [ "$arm64_m" = "b700" ] || { echo '::error::binary/arm64 架构校验失败'; exit 1; }

      - name: 更新版本记录并提交
        if: steps.up.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.up.outputs.tag }}"
          ver="${{ steps.up.outputs.ver }}"

          printf '%s\n' "$tag" > kernel.tag
          [ -n "$ver" ] && printf '%s\n' "$ver" > kernel.version

          vc=$(grep '^versionCode=' module.prop | cut -d= -f2)
          sed -i "s/^versionCode=.*/versionCode=$((vc + 1))/" module.prop

          # module.prop 的 version 形如 "3.2.0 (1.2026.08.05-0921)"，同步括号内的内核版本
          if [ -n "$ver" ]; then
            sed -i -E "s/^version=([0-9]+\.[0-9]+\.[0-9]+) ?\(.*\)/version=\1 ($ver)/" module.prop
          fi
          grep '^version' module.prop

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add binary/arm binary/arm64 kernel.tag kernel.version module.prop
          if git diff --cached --quiet; then
            echo '没有变化，跳过提交'
            exit 0
          fi
          git commit -m "chore: 内核更新至 ${tag} (${ver})"
          git push

      - name: 无更新
        if: steps.up.outputs.changed == 'false'
        run: |
          if [ -n "${{ steps.up.outputs.tag }}" ]; then
            echo "已是最新稳定版内核 ${{ steps.up.outputs.tag }}，无需操作。"
          else
            echo "上游暂无稳定版 Release（最新均为 RC/预发布），本次跳过。"
          fi
