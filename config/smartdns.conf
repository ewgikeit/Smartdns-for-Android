# dns server name, default is host name
# server-name, 
# example:
#   server-name smartdns
#

# whether resolv local hostname to ip address
# resolv-hostname yes

# dns server run user
# user [root|radio]
# example: run as nobody
#   user radio
#

# Include another configuration options
# conf-file [file]
# conf-file blacklist-ip.conf

# ── 手写的固定规则（内容不随订阅更新，直接引用）────────────────────
# IP 标记
conf-file ./ip/bogus-nxdomain.china.conf
# blacklist-ip 已停用：它只有在上游加 -blacklist-ip 时才生效，而表里混了
# 172.217.24.0/24、172.217.161.0/24（谷歌真实网段）、1.1.1.1、108.160.0.0/16
# 这类会误杀正常结果的条目，拦不住现在常见的「解析到无关真实 IP」式污染。
# 文件保留为空占位，兼容还没删这行引用的旧配置（缺文件内核会拒绝启动）。
# 域名标记（内网/特殊后缀走 bootstrap）
conf-file ./domain_diverg/defaults.conf
# hosts（localhost 等本机映射）
conf-file ./hosts/defaults.conf

# ── 订阅规则（封锁域名 / 国内域名 / 国外域名 / 网段 / hosts）──────────
# 由「规则源」统一生成，这里只引用汇总文件。
# 想换源、改刷新间隔、加自己的黑名单：WebUI「规则」页，
# 或直接编辑 /data/adb/smartdns/rulesrc/sources.conf。
# 不要手改 ./rules/ 下的文件 —— 每次更新都会被覆盖。
conf-file ./rules/index.conf

# dns server bind ip and port, default dns server port is 53, support binding multi ip and port
# bind udp server
#   bind [IP]:[port][@device] [-group [group]] [-no-rule-addr] [-no-rule-nameserver] [-no-rule-ipset] [-no-speed-check] [-no-cache] [-no-rule-soa] [-no-dualstack-selection]
# bind tcp server
#   bind-tcp [IP]:[port][@device] [-group [group]] [-no-rule-addr] [-no-rule-nameserver] [-no-rule-ipset] [-no-speed-check] [-no-cache] [-no-rule-soa] [-no-dualstack-selection]
# bind tls server
#   bind-tls [IP]:[port][@device] [-group [group]] [-no-rule-addr] [-no-rule-nameserver] [-no-rule-ipset] [-no-speed-check] [-no-cache] [-no-rule-soa] [-no-dualstack-selection]
#   bind-cert-key-file [path to file]
#      tls private key file
#   bind-cert-file [path to file]
#      tls cert file
#   bind-cert-key-pass [password]
#      tls private key password
# option:
#   -group: set domain request to use the appropriate server group.
#   -no-rule-addr: skip address rule.
#   -no-rule-nameserver: skip nameserver rule.
#   -no-rule-ipset: skip ipset rule or nftset rule.
#   -no-speed-check: do not check speed.
#   -no-cache: skip cache.
#   -no-rule-soa: Skip address SOA(#) rules.
#   -no-dualstack-selection: Disable dualstack ip selection.
#   -force-aaaa-soa: force AAAA query return SOA.
#   -ipset ipsetname: use ipset rule.
#   -nftset nftsetname: use nftset rule.
# example: 
#  IPV4: 
#    bind :53
#    bind :53@eth0
#    bind :6053 -group office -no-speed-check
#  IPV6:
#    bind [::]:53
#    bind [::]:53@eth0
#    bind-tcp [::]:53
bind [::]:6053 -no-rule-ipset
bind-tcp [::]:6053 -no-rule-ipset

# tcp connection idle timeout
# tcp-idle-time [second]

# dns cache size
# cache-size [number]
#   0: for no cache
#   -1: auto set cache size
cache-size -1

# enable persist cache when restart
# cache-persist no

# cache persist file
cache-file /dev/smartdns/tmp/dns_cache

# cache persist time
# cache-checkpoint-time [second]
# cache-checkpoint-time 86400

# prefetch domain
# prefetch-domain [yes|no]
# prefetch-domain yes

# cache serve expired 
# serve-expired [yes|no]
# serve-expired yes

# cache serve expired TTL
# serve-expired-ttl [num]
# serve-expired-ttl 0

# reply TTL value to use when replying with expired data
# serve-expired-reply-ttl [num]
# serve-expired-reply-ttl 30

# List of hosts that supply bogus NX domain results 
# bogus-nxdomain [ip/subnet]

# List of IPs that will be filtered when nameserver is configured -blacklist-ip parameter
# blacklist-ip [ip/subnet]

# List of IPs that will be accepted when nameserver is configured -whitelist-ip parameter
# whitelist-ip [ip/subnet]

# List of IPs that will be ignored
# ignore-ip [ip/subnet]

# speed check mode
# speed-check-mode [ping|tcp:port|none|,]
# example:
#   speed-check-mode ping,tcp:80,tcp:443
speed-check-mode tcp:443,ping
#   speed-check-mode none

# force AAAA query return SOA
# force-AAAA-SOA [yes|no]

# force specific qtype return soa
# force-qtype-SOA [qtypeid |...]
# force-qtype-SOA [qtypeid,...]
# force-qtype-SOA 65 28
# force-qtype-SOA 65,28
force-qtype-SOA 65

# Enable IPV4, IPV6 dual stack IP optimization selection strategy
# dualstack-ip-selection-threshold [num] (0~1000)
# dualstack-ip-allow-force-AAAA [yes|no]
# dualstack-ip-selection [yes|no]
# dualstack-ip-selection no

# edns client subnet
# edns-client-subnet [ip/subnet]
# edns-client-subnet 192.168.1.1/24
# edns-client-subnet 8::8/56

# ttl for all resource record
# rr-ttl: ttl for all record
# rr-ttl-min: minimum ttl for resource record
# rr-ttl-max: maximum ttl for resource record
# rr-ttl-reply-max: maximum reply ttl for resource record
# example:
# rr-ttl 300
# rr-ttl-min 60
# rr-ttl-max 86400
# rr-ttl-reply-max 60

# Maximum number of IPs returned to the client|8|number of IPs, 1~16
# example:
# max-reply-ip-num 1

# response mode
# Experimental feature
# response-mode [first-ping|fastest-ip|fastest-response]

# set log level
# log-level: [level], level=off, fatal, error, warn, notice, info, debug
# log-file: file path of log file.
# log-console [yes|no]: output log to console.
# log-size: size of each log file, support k,m,g
# log-num: number of logs, 0 means disable log
log-level info

log-file /data/adb/smartdns/log/smartdns.log
# log-size 128k
# log-num 2
# log-file-mode [mode]: file mode of log file.

# dns audit
# audit-enable [yes|no]: enable or disable audit.
# audit-enable yes
# audit-SOA [yes|no]: enable or disable log soa result.
# audit-size size of each audit file, support k,m,g
audit-file /data/adb/smartdns/log/smartdns-audit.log
# audit-console [yes|no]: output audit log to console.
# audit-file-mode [mode]: file mode of audit file.
# audit-size 128k
# audit-num 2

# Support reading dnsmasq dhcp file to resolve local hostname
# dnsmasq-lease-file /var/lib/misc/dnsmasq.leases

# certificate file
# ca-file [file]
ca-file /dev/smartdns/binary/CA/ca-certificates.crt

# certificate path
# ca-path [path]
ca-path /dev/smartdns/binary/CA

# remote udp dns server list
# server [IP]:[PORT]|URL [-blacklist-ip] [-whitelist-ip] [-check-edns] [-group [group] ...] [-exclude-default-group]
# default port is 53
#   -blacklist-ip: filter result with blacklist ip
#   -whitelist-ip: filter result with whitelist ip,  result in whitelist-ip will be accepted.
#   -check-edns: result must exist edns RR, or discard result.
#   -group [group]: set server to group, use with nameserver /domain/group.
#   -exclude-default-group: exclude this server from default group.
#   -proxy [proxy-name]: use proxy to connect to server.
#   -bootstrap-dns: set as bootstrap dns server.
#   -set-mark: set mark on packets.
#   -subnet [ip/subnet]: set edns client subnet.
#   -host-ip [ip]: set dns server host ip.
# server 8.8.8.8 -blacklist-ip -check-edns -group g1 -group g2
# server tls://dns.google:853 
# server https://dns.google/dns-query

# remote tcp dns server list
# server-tcp [IP]:[PORT] [-blacklist-ip] [-whitelist-ip] [-group [group] ...] [-exclude-default-group]
# default port is 53
# server-tcp 8.8.8.8

# remote tls dns server list
# server-tls [IP]:[PORT] [-blacklist-ip] [-whitelist-ip] [-spki-pin [sha256-pin]] [-group [group] ...] [-exclude-default-group]
#   -spki-pin: TLS spki pin to verify.
#   -tls-host-verify: cert hostname to verify.
#   -host-name: TLS sni hostname.
#   -no-check-certificate: no check certificate.
#   -proxy [proxy-name]: use proxy to connect to server.
#   -bootstrap-dns: set as bootstrap dns server.
# Get SPKI with this command:
#    echo | openssl s_client -connect '[ip]:853' | openssl x509 -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | openssl enc -base64
# default port is 853
# server-tls 8.8.8.8
# server-tls 1.0.0.1

# remote https dns server list
# server-https https://[host]:[port]/path [-blacklist-ip] [-whitelist-ip] [-spki-pin [sha256-pin]] [-group [group] ...] [-exclude-default-group]
#   -spki-pin: TLS spki pin to verify.
#   -tls-host-verify: cert hostname to verify.
#   -host-name: TLS sni hostname.
#   -http-host: http host.
#   -no-check-certificate: no check certificate.
#   -proxy [proxy-name]: use proxy to connect to server.
#   -bootstrap-dns: set as bootstrap dns server.
# default port is 443
# server-https https://cloudflare-dns.com/dns-query

# socks5 and http proxy list
# proxy-server URL -name [proxy name]
#   URL: socks5://[username:password@]host:port
#        http://[username:password@]host:port
#   -name: proxy name, use with server -proxy [proxy-name]
# example:
#   proxy-server socks5://user:pass@1.2.3.4:1080 -name proxy
#   proxy-server http://user:pass@1.2.3.4:3128 -name proxy

# specific nameserver to domain
# nameserver /domain/[group|-]
# nameserver /www.example.com/office, Set the domain name to use the appropriate server group.
# nameserver /www.example.com/-, ignore this domain

# expand ptr record from address record
# expand-ptr-from-address yes

# specific address to domain
# address /domain/[ip1,ip2|-|-4|-6|#|#4|#6]
# address /www.example.com/1.2.3.4, return ip 1.2.3.4 to client
# address /www.example.com/1.2.3.4,5.6.7.8, return multiple ip addresses
# address /www.example.com/-, ignore address, query from upstream, suffix 4, for ipv4, 6 for ipv6, none for all
# address /www.example.com/#, return SOA to client, suffix 4, for ipv4, 6 for ipv6, none for all

# specific cname to domain
# cname /domain/target

# enalbe DNS64 feature
# dns64 [ip/subnet]
# dns64 64:ff9b::/96

# enable ipset timeout by ttl feature
# ipset-timeout [yes]

# specific ipset to domain
# ipset /domain/[ipset|-]
# ipset /www.example.com/block, set ipset with ipset name of block 
# ipset /www.example.com/-, ignore this domain

# add to ipset when ping is unreachable
# ipset-no-speed ipsetname
# ipset-no-speed pass

# enable nftset timeout by ttl feature
# nftset-timeout [yes|no]
# nftset-timeout yes

# add to nftset when ping is unreachable
# nftset-no-speed [#4:ip#table#set,#6:ipv6#table#setv6]
# nftset-no-speed #4:ip#table#set

# enable nftset debug, check nftset setting result, output log when error.
# nftset-debug [yes|no]
# nftset-debug yes

# specific nftset to domain
# nftset /domain/[#4:ip#table#set,#6:ipv6#table#setv6]
# nftset /www.example.com/ip#table#set, equivalent to 'nft add element ip table set { ... }'
# nftset /www.example.com/-, ignore this domain
# nftset /www.example.com/#6:-, ignore ipv6

# set ddns domain
# ddns-domain domain

# set domain rules
# domain-rules /domain/ [-speed-check-mode [...]]
# rules:
#   [-c] -speed-check-mode [mode]: speed check mode
#                             speed-check-mode [ping|tcp:port|none|,]
#   [-a] -address [address|-]: same as address option
#   [-n] -nameserver [group|-]: same as nameserver option
#   [-p] -ipset [ipset|-]: same as ipset option
#   [-t] -nftset [nftset|-]: same as nftset option
#   [-d] -dualstack-ip-selection [yes|no]: same as dualstack-ip-selection option
#   -no-serve-expired: ignore expired domain
#   -delete: delete domain rule

# collection of domains 
# the domain-set can be used with /domain/ for address, nameserver, ipset, etc.
# domain-set -name [set-name] -type list -file [/path/to/file]
#   [-n] -name [set name]: domain set name
#   [-t] -type [list]: domain set type, list only now
#   [-f] -file [path/to/set]: file path of domain set
# 
# example:
# domain-set -name domain-list -type list -file /etc/smartdns/domain-list.conf
# address /domain-set:domain-list/1.2.3.4
# nameserver /domain-set:domain-list/server-group
# ipset /domain-set:domain-list/ipset
# domain-rules /domain-set:domain-list/ -speed-check-mode ping


#	bootstrap
# 默认不留 bootstrap：下面所有上游都是「IP 直连 + SNI」，不需要再解析上游
# 主机名，所以内核自己不会发出任何明文 :53 查询。这一点对「本机模式」很重要 ——
# 拦截系统解析要靠 iptables 重定向，而重定向只匹配 53 端口；内核没有明文查询，
# 就不存在「自己劫持自己」的风险，放行规则也就不用跟着配置变。
#
# 如果你要把某个上游换回主机名写法（例如 `server dns.example.com`），
# 再把 bootstrap 打开，并把下面几行放出来：
# server 223.5.5.5 -group bootstrap -exclude-default-group
# server 119.29.29.29 -group bootstrap -exclude-default-group

#	China
# DoT 同样用 IP 直连 + SNI：-host-name 决定 SNI 与 HTTP Host，
# -tls-host-verify 校验证书域名，两个必须成对写，只写 IP 会握手失败。
server-tls 223.5.5.5:853 -host-name dns.alidns.com -tls-host-verify dns.alidns.com -whitelist-ip -group China
server-tls 1.12.12.12:853 -host-name dot.pub -tls-host-verify dot.pub -whitelist-ip -group China

#	运营商本地解析（默认关闭）
#
# 运营商自己的 DNS 走**明文 :53**，好处是能拿到更贴近本网的 CDN 节点；代价是它
# 会成为这套配置里唯一的明文上游 —— 模块会用 iptables 按目的地放行它，开了也能
# 正常工作，但配置就不再是「零明文」了。
#
# 【想启用请自己填】运营商 DNS 各地不同，模块不能替你猜。两个来源：
#   1. 路由器管理页里的 WAN / 上网信息，通常写着主/备 DNS；
#   2. 搜索「<你的运营商> <省份> 本地 DNS」，例如「电信 广东 DNS」。
# 填法（以广东电信/联通/移动为例，把 IP 换成你自己的）：
# address /telecom.ISP/202.96.128.68
# server telecom.ISP -whitelist-ip -group China -exclude-default-group
# address /unicom.ISP/210.21.196.6
# server unicom.ISP -whitelist-ip -group China -exclude-default-group
# address /mobile.ISP/211.138.180.2
# server mobile.ISP -whitelist-ip -group China -exclude-default-group
#
# 注意：address 那一行是给 server 的主机名钉 IP 用的（避免再走 bootstrap 解析），
# 两行要一起加。只加 server 不加 address，会退化成主机名上游、需要 bootstrap。


#	foreign
# ─────────────────────────────────────────────────────────────────────────────
# 【这一节需要你改成自己的代理，否则境外域名解析不出来】
#
# 为什么必须走代理：在受限网络里，设备直连境外 443 会被 RST；明文 53 拿到的是
# 污染答案（实测 www.google.com 被解成 2001::1、31.13.92.37 这类无关 IP）。
# 所以下面的境外上游一律通过你本机的代理软件出去。
#
# 要填的只有两处：
#   1) proxy-server 的「端口」——换成你本机代理的 SOCKS5/HTTP 端口
#        Clash     常见 7891（mixed 端口）
#        v2rayNG   常见 10808
#        sing-box  常见 2080
#      用 HTTP 代理就把 socks5:// 换成 http://，带密码写 socks5://用户:密码@127.0.0.1:端口
#   2) -name 后面的「名字」——随便起，但下面 server-https 的 -proxy 必须写成同一个
#
# 没有代理也可以：把下面两行 server-https 全部注释掉。内核会因为 foreign 组里
# 没有可用上游而立即失败，比原来卡 2 秒再去连一个假 IP 要好。
# ─────────────────────────────────────────────────────────────────────────────
proxy-server socks5://127.0.0.1:10808 -name myproxy

# IP 直连 + SNI/证书校验：不解析上游主机名，所以既不依赖 bootstrap，也不怕
# bootstrap 被污染（明文 53 的 bootstrap 在受限网络里同样会被污染）。
server-https https://8.8.8.8/dns-query -host-name dns.google -http-host dns.google -tls-host-verify dns.google -proxy myproxy -group foreign
server-https https://1.1.1.1/dns-query -host-name cloudflare-dns.com -http-host cloudflare-dns.com -tls-host-verify cloudflare-dns.com -proxy myproxy -group foreign
